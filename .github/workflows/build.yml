name: Build
on: [push, pull_request]

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build
        run: |
          mkdir -p ./build &&
          docker build --tag libpulse . &&
          docker save libpulse |
          tar -xvf - -C ./build &&
          tar -xvf ./build/blobs/sha256/$(ls -1S ./build/blobs/sha256|head -n3|tail -n1) -C ./build
      - name: Upload (pulse.zip)
        uses: actions/upload-artifact@v7
        with:
          name: Headers (pulse.zip)
          path: build/libpulse/pulse.zip
